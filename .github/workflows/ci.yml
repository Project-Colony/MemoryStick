name: CI

# The release workflow only builds once release-please has cut a tag, so
# without this a change that broke the build, the lints or the Windows
# version resource was found at release time, on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every GitHub-hosted runner image: no third-party action to
      # pin, and nothing for Dependabot to lose track of.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-${{ matrix.os }}

      # Same list as the release workflow.
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      # Same check as the release workflow's Windows leg: SignPath signs only
      # an .exe whose version resource names the project and carries its
      # version, and tauri-build is what writes it.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'memorystick' | ForEach-Object version
          $info = (Get-Item target\debug\memorystick.exe).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'MemoryStick' -or $info.ProductVersion -cne $version) {
            "::error::memorystick.exe has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'MemoryStick' and '$version'"
            exit 1
          }

      - name: Test
        run: cargo test --locked

  # rust-version in Cargo.toml is a promise; this job is what keeps it. It
  # builds and tests on exactly that toolchain, read from Cargo.toml so the
  # two cannot drift apart.
  #
  # RUSTUP_TOOLCHAIN is what pins the cargo invocations: it outranks both the
  # runner's rustup default and any rust-toolchain.toml. The rustc check makes
  # a pin that silently stopped working fail loudly.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build and test on the declared floor
        run: |
          rustc --version | grep -q "^rustc ${RUSTUP_TOOLCHAIN}[. ]" \
            || { echo "::error::expected rustc ${RUSTUP_TOOLCHAIN}, got $(rustc --version)"; exit 1; }
          cargo test --locked

  colony-themes:
    name: Colony themes
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      # The Project-Colony-Resources commit src/ui/vendor/colony/ is copied
      # from. Bump it together with src/ui/vendor/colony/README.md.
      COLONY_RESOURCES_REV: 8931f2b38422fe75757db6218a6bcbc8caa06a85

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vendored files match Project-Colony-Resources
        run: |
          base="https://raw.githubusercontent.com/Project-Colony/Project-Colony-Resources/$COLONY_RESOURCES_REV/generated"
          curl -fsSL --retry 3 "$base/css/colony-themes.css" | cmp - src/ui/vendor/colony/colony-themes.css
          curl -fsSL --retry 3 "$base/css/colony-accents.css" | cmp - src/ui/vendor/colony/colony-accents.css
          curl -fsSL --retry 3 "$base/themes.json" | cmp - src/ui/vendor/colony/themes.json

      - name: Every theme defines the colours src/ui/ uses, and accent labels stay legible
        run: python3 .github/scripts/check-colony-themes.py

  # render() in src/ui/app.js is the only place a document's scripts, frames
  # and style sheets are removed (comrak keeps raw HTML as written).
  document-filter:
    name: Document filter
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: render() drops every element that could act on the page
        run: python3 .github/scripts/check-document-filter.py
