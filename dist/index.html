<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-dns-prefetch-control" content="off">
  <!-- No <style> element here: Tauri would give it a nonce in style-src,
       and the web view would then ignore the 'unsafe-inline' that KaTeX and
       Mermaid need for their inline styles. The policy is "csp" in
       src-tauri/tauri.conf.json. -->
  <title>MemoryStick</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="vendor/colony/colony-themes.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <button id="open-btn" title="Open a file (Ctrl+O)">📂 Open</button>
    <button id="toc-btn" title="Table of contents">☰ Contents</button>
    <span id="filename">No file</span>
    <label for="theme-select">Theme</label>
    <select id="theme-select" title="Ctrl+D switches between light and dark">
      <option value="">System (Gruvbox)</option>
    </select>
  </header>

  <aside id="toc-panel" class="hidden">
    <div class="toc-title">Table of contents</div>
    <nav id="toc-nav"></nav>
  </aside>

  <main id="main">
    <div id="drop-hint">
      <div class="hint-icon">📄</div>
      <div class="hint-title">Drop a <code>.md</code> file here</div>
      <div class="hint-sub">or click "📂 Open" in the toolbar</div>
    </div>
    <article id="content" class="markdown-body"></article>
  </main>

  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
