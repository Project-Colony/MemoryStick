<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-dns-prefetch-control" content="off">
  <!-- No <style> element here: Tauri would give it a nonce in style-src,
       and the web view would then ignore the 'unsafe-inline' that KaTeX and
       Mermaid need for their inline styles. The policy is "csp" in
       src-tauri/tauri.conf.json. -->
  <title>MemoryStick</title>
  <link rel="stylesheet" href="vendor/colony/colony-themes.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <!-- After the stylesheets, which a script waits for: theme.js reads the
       palette, and runs before the first paint. -->
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <header id="toolbar">
    <!-- The program's name is the way into Preferences, as in every Colony
         program (design/navigation.md in Project-Colony-Resources). -->
    <button id="identity" aria-pressed="false" aria-controls="preferences" data-i18n-title="identity_tooltip">
      MemoryStick <span class="icon gear" aria-hidden="true">&#xf013;</span>
    </button>
    <button id="open-btn" data-i18n-title="toolbar_open_tooltip"><span class="icon" aria-hidden="true">&#xf07c;</span> <span data-i18n="toolbar_open"></span></button>
    <button id="toc-btn" data-i18n-title="toolbar_contents_tooltip"><span class="icon" aria-hidden="true">&#xf0ca;</span> <span data-i18n="toolbar_contents"></span></button>
    <span id="filename" data-i18n="toolbar_no_file"></span>
  </header>

  <aside id="toc-panel" class="hidden">
    <div class="toc-title" data-i18n="toc_title"></div>
    <nav id="toc-nav"></nav>
  </aside>

  <main id="main">
    <div id="drop-hint">
      <div class="hint-icon" aria-hidden="true">&#xf0f6;</div>
      <div class="hint-title" data-i18n="drop_title"></div>
      <div class="hint-sub" data-i18n="drop_subtitle"></div>
    </div>
    <article id="content" class="markdown-body"></article>
  </main>

  <!-- Replaces #main while open; filled in by preferences.js. -->
  <section id="preferences" hidden></section>

  <div id="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-close" class="icon" data-i18n-title="toast_dismiss" data-i18n-label="toast_dismiss">&#xf00d;</button>
  </div>

  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="app.js"></script>
  <script src="preferences.js"></script>
</body>
</html>
