[package]
name = "memorystick"
version = "0.1.0" # x-release-please-version
description = "A Markdown viewer"
authors = ["MotherSphere"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/MemoryStick"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = "2.7.1"

[dependencies]
tauri = "2.12.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
percent-encoding = "2.3.2"
comrak = { version = "0.56.0", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"
